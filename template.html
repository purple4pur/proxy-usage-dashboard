<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流量使用统计</title>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="b7a368ac-7d0a-48fc-aab9-7abc528db384"></script>
    <script src="https://app.rybbit.io/api/script.js" data-site-id="e0fc50ec8fa2" defer></script>
    <style>
        :root {
            --bg: #eceff4;
            --panel: #ffffff;
            --panel-2: #f1f5f9;
            --border: #cbd5e1;
            --text: #0f172a;
            --muted: #475569;
            --accent: #0e5d57;
            --accent-fg: #ffffff;
            --accent-soft: rgba(14, 93, 87, 0.12);
            --upload: #2563eb;
            --download: #db2777;
            --warn: #b45309;
            --violet: #6d28d9;
            --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 2px 4px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.08);
            --radius: 14px;
            --radius-sm: 8px;
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        }

        [data-theme="dark"] {
            --bg: #070a10;
            --panel: #121826;
            --panel-2: #1c2533;
            --border: #2e3b4d;
            --text: #f2f6fa;
            --muted: #a9b6c6;
            --accent: #3ddcc5;
            --accent-fg: #06201d;
            --accent-soft: rgba(61, 220, 197, 0.14);
            --upload: #60a5fa;
            --download: #f472b6;
            --warn: #fbbf24;
            --violet: #a78bfa;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.4), 0 12px 32px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 24px 20px 48px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* 细腻噪点纹理，避免纯色背景的生硬感 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/></svg>");
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
        }

        h1, h2, h3 {
            text-wrap: balance;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            padding: 8px 4px 28px;
        }

        .kicker {
            font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 6px;
        }

        h1 {
            color: var(--text);
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            flex: none;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            background: color-mix(in srgb, currentColor 12%, transparent);
        }

        .stat-value {
            font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 2px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .chart-container {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .chart-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
        }

        .chart-actions {
            display: flex;
            gap: 6px;
        }

        .chart-btn {
            font-family: inherit;
            min-height: 44px;
            padding: 8px 14px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--muted);
            cursor: pointer;
            font-size: 0.85rem;
            transition: background-color 0.1s ease, color 0.1s ease, border-color 0.1s ease, transform 0.1s ease;
        }

        .chart-btn:hover {
            color: var(--text);
            border-color: var(--accent);
        }

        .chart-btn:active {
            transform: scale(0.97);
        }

        .chart-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-fg);
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
            flex-grow: 1;
            min-height: 300px;
        }

        .data-table {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        .data-table summary {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            list-style: none;
            user-select: none;
        }

        .data-table summary::-webkit-details-marker {
            display: none;
        }

        .data-table summary::before {
            content: "▸";
            color: var(--accent);
            transition: transform 0.15s ease;
        }

        .data-table[open] summary::before {
            transform: rotate(90deg);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px 20px;
            text-align: right;
            border-top: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        th:first-child, td:first-child {
            text-align: left;
        }

        th {
            background-color: var(--panel-2);
            color: var(--muted);
            font-weight: 600;
            font-size: 0.8rem;
        }

        tbody tr:hover {
            background-color: var(--accent-soft);
        }

        footer {
            text-align: center;
            margin-top: 32px;
            padding: 20px 0;
            color: var(--muted);
            font-size: 0.8rem;
        }

        footer a {
            color: var(--muted);
        }

        footer a:hover {
            color: var(--accent);
        }

        /* 主题切换按钮 */
        .theme-toggle {
            flex: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .theme-toggle:active {
            transform: scale(0.96);
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .stat-card, .chart-container {
            animation: rise 0.32s var(--ease-out) both;
        }

        .stats-grid > :nth-child(2), .charts-grid > :nth-child(2) { animation-delay: 60ms; }
        .stats-grid > :nth-child(3), .charts-grid > :nth-child(3) { animation-delay: 120ms; }
        .stats-grid > :nth-child(4), .charts-grid > :nth-child(4) { animation-delay: 180ms; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: none; }
        }

        @media (max-width: 1030px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px 10px 32px;
            }

            .stat-card {
                padding: 14px 16px;
            }

            .stat-value {
                font-size: 1.3rem;
            }

            .chart-container {
                padding: 14px;
            }

            .chart-btn {
                min-height: 40px;
                padding: 6px 10px;
                font-size: 0.8rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <p class="kicker">Proxy Traffic Monitor</p>
                <h1>流量使用统计</h1>
                <p class="subtitle" id="date-range">YYYY-MM-DD 至 YYYY-MM-DD 流量使用分析</p>
                <p class="subtitle">数据更新时间：{{ current_time }}</p>
            </div>
            <button class="theme-toggle" id="theme-toggle" type="button" title="切换深色模式" aria-label="切换深色模式">
                <i class="fa fa-moon-o" aria-hidden="true"></i>
            </button>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="color: var(--accent);">
                    <i class="fa fa-database"></i>
                </div>
                <div class="stat-value" id="total-available">NULL GB</div>
                <div class="stat-label">总可用流量</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon" style="color: var(--warn);">
                    <i class="fa fa-line-chart"></i>
                </div>
                <div class="stat-value" id="total-used">NULL GB</div>
                <div class="stat-label">已用流量</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon" style="color: var(--violet);">
                    <i class="fa fa-tachometer"></i>
                </div>
                <div class="stat-value" id="usage-percent">NULL%</div>
                <div class="stat-label">使用率</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon" style="color: var(--upload);">
                    <i class="fa fa-hourglass-half"></i>
                </div>
                <div class="stat-value" id="remaining-days">NULL 天</div>
                <div class="stat-label">预计剩余天数</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <div class="chart-header">
                    <h2 class="chart-title">已用流量</h2>
                    <div class="chart-actions">
                        <button class="chart-btn" data-chart="totalUsageChart" data-range="7">7天</button>
                        <button class="chart-btn active" data-chart="totalUsageChart" data-range="14">14天</button>
                        <button class="chart-btn" data-chart="totalUsageChart" data-range="30">30天</button>
                        <button class="chart-btn" data-chart="totalUsageChart" data-range="all">全部</button>
                    </div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="totalUsageChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-header">
                    <h2 class="chart-title">使用率</h2>
                    <div class="chart-actions">
                        <button class="chart-btn" data-chart="percentChart" data-range="7">7天</button>
                        <button class="chart-btn active" data-chart="percentChart" data-range="14">14天</button>
                        <button class="chart-btn" data-chart="percentChart" data-range="30">30天</button>
                        <button class="chart-btn" data-chart="percentChart" data-range="all">全部</button>
                    </div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="percentChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-header">
                    <h2 class="chart-title">每日上传下载量</h2>
                    <div class="chart-actions">
                        <button class="chart-btn" data-chart="dailyUsageChart" data-range="7">7天</button>
                        <button class="chart-btn active" data-chart="dailyUsageChart" data-range="14">14天</button>
                        <button class="chart-btn" data-chart="dailyUsageChart" data-range="30">30天</button>
                        <button class="chart-btn" data-chart="dailyUsageChart" data-range="all">全部</button>
                    </div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="dailyUsageChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-header">
                    <h2 class="chart-title">上传下载比例</h2>
                    <div class="chart-actions">
                        <button class="chart-btn" data-chart="ratioChart" data-range="7">7 天</button>
                        <button class="chart-btn active" data-chart="ratioChart" data-range="14">14 天</button>
                        <button class="chart-btn" data-chart="ratioChart" data-range="30">30 天</button>
                        <button class="chart-btn" data-chart="ratioChart" data-range="all">全部</button>
                    </div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="ratioChart"></canvas>
                </div>
            </div>
        </div>

        <details class="data-table">
            <summary>详细数据</summary>
            <table>
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>累计上传 (GB)</th>
                        <th>累计下载 (GB)</th>
                        <th>总使用量 (GB)</th>
                        <th>使用率 (%)</th>
                    </tr>
                </thead>
                <tbody id="data-table-body">
                </tbody>
            </table>
        </details>

        <footer>
            <p>© 2025 Purple4pur | <a href='https://github.com/purple4pur/proxy-usage-dashboard'>你们这里谁最懂 Vibe Coding</a></p>
        </footer>
    </div>

    <script>
        // 从CSV数据生成的结构化数据
        // ==================== 主题颜色配置 ====================
        const THEME_COLORS = {
            light: {
                grid: 'rgba(15, 23, 42, 0.1)',
                text: '#0f172a',
                tooltipBorder: 'rgba(15, 23, 42, 0.2)',
                series: {
                    available: '#0f766e',
                    used: '#d97706',
                    percent: '#7c3aed',
                    upload: '#2563eb',
                    download: '#db2777'
                }
            },
            dark: {
                grid: 'rgba(242, 246, 250, 0.1)',
                text: '#f2f6fa',
                tooltipBorder: 'rgba(255, 255, 255, 0.2)',
                series: {
                    available: '#2dd4bf',
                    used: '#fbbf24',
                    percent: '#a78bfa',
                    upload: '#3b82f6',
                    download: '#ec4899'
                }
            }
        };

        function rgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        /**
         * 获取当前主题的颜色配置
         * @returns {Object} 包含 grid, text, tooltipBorder 颜色值的对象
         */
        function getThemeColors() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            return THEME_COLORS[isDark ? 'dark' : 'light'];
        }

        // ==================== 数据初始化 ====================
        const trafficData = [
            {% for entry in traffic_data -%}
            {date: '{{ entry.date }}', upload: {{ entry.upload }}, download: {{ entry.download }}, totalUsed: {{ entry.totalUsed }}, usedPercent: {{ entry.usedPercent }}}{% if not loop.last -%},{% endif %}
            {% endfor -%}
        ];

        // 总流量
        const totalGB = {{ total_gb }};

        // 是否丢弃第一天 (只影响每日上传下载量图表)
        // discard_day1=true: 丢弃第一天，从第二天开始显示
        // discard_day1=false: 保留第一天，第一天数据设为 0 (默认)
        const discardDay1 = {{ 'true' if discard_day1 else 'false' }};

        // 计算每日增量数据
        // discard_day1=true: 丢弃第一天，从第二天开始显示
        // discard_day1=false: 第一天直接使用当日数据（不减去前一天），从第二天起正常减去前一天
        const dailyIncrements = trafficData.map((entry, index) => {
            if (index === 0) {
                // 第一天：根据开关决定是设为 0 还是使用实际数据
                return {
                    date: entry.date,
                    upload: discardDay1 ? 0 : entry.upload,
                    download: discardDay1 ? 0 : entry.download,
                    total: discardDay1 ? 0 : (entry.upload + entry.download)
                };
            }

            return {
                date: entry.date,
                upload: entry.upload - trafficData[index - 1].upload,
                download: entry.download - trafficData[index - 1].download,
                total: (entry.upload - trafficData[index - 1].upload) +
                       (entry.download - trafficData[index - 1].download)
            };
        });

        // 根据开关决定是否丢弃第一天 (只影响每日上传下载量图表)
        const processedIncrements = discardDay1 ? dailyIncrements.slice(1) : dailyIncrements;

        // 计算日均总流量 (基于处理后的数据)
        const dailyTotals = processedIncrements.map(entry => entry.total);
        const avgTotal = dailyTotals.length > 0 ? dailyTotals.reduce((sum, val) => sum + val, 0) / dailyTotals.length : 0;

        // 提取图表所需数据
        // 日期格式：YYYY-MM-DD -> MM-DD (substring(5) 截取第 5 位之后的字符)
        const dates = trafficData.map(entry => entry.date.substring(5));
        const totalUsed = trafficData.map(entry => entry.totalUsed);
        const usedPercent = trafficData.map(entry => entry.usedPercent);
        const uploadDaily = processedIncrements.map(entry => entry.upload);
        const downloadDaily = processedIncrements.map(entry => entry.download);
        const totalDaily = processedIncrements.map(entry => entry.total);
        const totalUpload = trafficData[trafficData.length - 1].upload;
        const totalDownload = trafficData[trafficData.length - 1].download;

        // 图表实例存储
        let totalUsageChart = null;
        let percentChart = null;
        let dailyUsageChart = null;
        let ratioChart = null;

        // 计算预计剩余天数（基于过去7天平均增幅）
        function calculateRemainingDays() {
            // 获取过去7天的使用率数据
            const last7Days = usedPercent.slice(-8, -1);

            if (last7Days.length < 2) {
                return "未知"; // 数据不足无法计算
            }

            // 计算每日增长量
            let dailyIncrements = [];
            for (let i = 1; i < last7Days.length; i++) {
                dailyIncrements.push(last7Days[i] - last7Days[i-1]);
            }

            // 计算平均每日增长量
            const avgDailyIncrement = dailyIncrements.reduce((sum, val) => sum + val, 0) / dailyIncrements.length;

            if (avgDailyIncrement <= 0) {
                return "未知"; // 增长量为负或零
            }

            // 计算剩余天数
            const currentUsage = usedPercent[usedPercent.length - 1];
            const remainingPercentage = 100 - currentUsage;
            const remainingDays = Math.ceil(remainingPercentage / avgDailyIncrement);

            return remainingDays;
        }

        // 更新统计数据
        function updateStats() {
            // 获取最后一条数据
            const lastData = trafficData[trafficData.length - 1];

            // 更新统计数据
            document.getElementById('total-available').textContent = totalGB.toFixed(1) + ' GB';
            document.getElementById('total-used').textContent = lastData.totalUsed.toFixed(1) + ' GB';
            document.getElementById('usage-percent').textContent = lastData.usedPercent.toFixed(1) + '%';

            // 计算并更新预计剩余天数
            const remainingDays = calculateRemainingDays();
            document.getElementById('remaining-days').textContent =
                typeof remainingDays === 'number' ? remainingDays + ' 天' : remainingDays;

            // 更新日期范围
            const startDate = trafficData[0].date;
            const endDate = trafficData[trafficData.length - 1].date;
            document.getElementById('date-range').textContent =
                `${startDate} 至 ${endDate} 流量使用分析`;
        }

        // 填充表格数据
        function populateTable() {
            const tableBody = document.getElementById('data-table-body');
            tableBody.innerHTML = '';

            trafficData.toReversed().forEach(entry => {
                const row = document.createElement('tr');

                row.innerHTML = `
                    <td>${entry.date}</td>
                    <td>${entry.upload.toFixed(1)}</td>
                    <td>${entry.download.toFixed(1)}</td>
                    <td>${entry.totalUsed.toFixed(1)}</td>
                    <td>${entry.usedPercent.toFixed(1)}%</td>
                `;

                tableBody.appendChild(row);
            });
        }

        /**
         * 应用当前主题的系列配色
         */
        function applyChartSeries(chart) {
            const s = getThemeColors().series;
            if (chart === totalUsageChart) {
                chart.data.datasets[0].borderColor = s.available;
                chart.data.datasets[0].backgroundColor = rgba(s.available, 0.08);
                chart.data.datasets[1].borderColor = s.used;
                chart.data.datasets[1].backgroundColor = rgba(s.used, 0.1);
            } else if (chart === percentChart) {
                chart.data.datasets[0].borderColor = s.percent;
                chart.data.datasets[0].backgroundColor = rgba(s.percent, 0.12);
            } else if (chart === dailyUsageChart) {
                chart.data.datasets[0].borderColor = s.download;
                chart.data.datasets[0].backgroundColor = rgba(s.download, 0.8);
                chart.data.datasets[1].borderColor = s.upload;
                chart.data.datasets[1].backgroundColor = rgba(s.upload, 0.8);
                chart.data.datasets[2].borderColor = s.available;
                chart.data.datasets[2].backgroundColor = rgba(s.available, 0.1);
            } else if (chart === ratioChart) {
                chart.data.datasets[0].backgroundColor = [rgba(s.upload, 0.9), rgba(s.download, 0.9)];
                chart.data.datasets[0].borderColor = [s.upload, s.download];
            }
        }

        /**
         * 初始化所有图表
         */
        function initCharts() {
            // 注册 datalabels 插件
            Chart.register(ChartDataLabels);

            // 获取当前主题颜色配置
            const colors = getThemeColors();
            const gridColor = colors.grid;
            const textColor = colors.text;

            // 1. 总流量使用趋势图
            const totalUsageCtx = document.getElementById('totalUsageChart').getContext('2d');
            totalUsageChart = new Chart(totalUsageCtx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [
                        {
                            label: '总可用流量',
                            data: Array(dates.length).fill(totalGB),
                            borderWidth: 2,
                            pointRadius: 0,
                            borderDash: [5, 5]
                        },
                        {
                            label: '已用流量',
                            data: totalUsed,
                            borderWidth: 3,
                            tension: 0.3,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        datalabels: { display: false },
                        legend: {
                            position: 'top',
                            labels: {
                                color: textColor
                            }
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            titleColor: '#ffffff',
                            bodyColor: '#ffffff',
                            borderColor: colors.tooltipBorder,
                            borderWidth: 1
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: '流量 (GB)',
                                color: textColor
                            },
                            ticks: {
                                color: textColor,
                                grid: {
                                    color: gridColor
                                }
                            },
                            grid: {
                                color: gridColor
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: '日期',
                                color: textColor
                            },
                            ticks: {
                                color: textColor
                            },
                            grid: {
                                color: gridColor
                            }
                        }
                    }
                }
            });

            // 2. 使用率变化图
            const percentCtx = document.getElementById('percentChart').getContext('2d');
            percentChart = new Chart(percentCtx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: '使用率',
                        data: usedPercent,
                        borderWidth: 3,
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        datalabels: { display: false },
                        legend: {
                            position: 'top',
                            labels: {
                                color: textColor
                            }
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            titleColor: '#ffffff',
                            bodyColor: '#ffffff',
                            borderColor: colors.tooltipBorder,
                            borderWidth: 1
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: '使用率 (%)',
                                color: textColor
                            },
                            ticks: {
                                color: textColor,
                                grid: {
                                    color: gridColor
                                },
                                callback: function(value) {
                                    return value + '%';
                                }
                            },
                            grid: {
                                color: gridColor
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: '日期',
                                color: textColor
                            },
                            ticks: {
                                color: textColor
                            },
                            grid: {
                                color: gridColor
                            }
                        }
                    }
                }
            });

            // 3. 每日上传下载柱状图（使用增量数据）- 堆叠柱状图
            const dailyUsageCtx = document.getElementById('dailyUsageChart').getContext('2d');
            dailyUsageChart = new Chart(dailyUsageCtx, {
                type: 'bar',
                data: {
                    // 根据开关决定是否包含第一天 (只影响每日上传下载量图表)
                    labels: discardDay1 ? dates.slice(1) : dates,
                    datasets: [
                        {
                            label: '下载',
                            data: downloadDaily,
                            borderWidth: 1,
                            stack: 'stacked'
                        },
                        {
                            label: '上传',
                            data: uploadDaily,
                            borderWidth: 1,
                            stack: 'stacked'
                        },
                        {
                            label: '日均总流量',
                            data: Array(processedIncrements.length).fill(avgTotal),
                            type: 'line',
                            borderWidth: 2,
                            pointRadius: 0,
                            borderDash: [5, 5],
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        datalabels: { display: false },
                        legend: {
                            position: 'top',
                            labels: {
                                color: textColor
                            }
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            titleColor: '#ffffff',
                            bodyColor: '#ffffff',
                            borderColor: colors.tooltipBorder,
                            borderWidth: 1,
                            callbacks: {
                                label: function(context) {
                                    const label = context.dataset.label || '';
                                    const value = context.raw || 0;

                                    // 为日均线添加特殊提示
                                    if (label === '日均总流量') {
                                        return `${label}: ${value.toFixed(2)} GB`;
                                    }

                                    return `${label}: ${value.toFixed(1)} GB`;
                                },
                                footer: function(tooltipItems) {
                                    // 计算当天总流量（从 tooltip 数据中获取上传和下载值）
                                    let uploadVal = 0;
                                    let downloadVal = 0;
                                    tooltipItems.forEach(item => {
                                        const label = item.dataset.label || '';
                                        if (label === '上传') uploadVal = item.raw || 0;
                                        if (label === '下载') downloadVal = item.raw || 0;
                                    });
                                    const total = uploadVal + downloadVal;
                                    return `总流量：${total.toFixed(1)} GB`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            stacked: true,
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: '流量 (GB)',
                                color: textColor
                            },
                            ticks: {
                                color: textColor,
                                grid: {
                                    color: gridColor
                                }
                            },
                            grid: {
                                color: gridColor
                            }
                        },
                        x: {
                            stacked: true,
                            title: {
                                display: true,
                                text: '日期',
                                color: textColor
                            },
                            ticks: {
                                color: textColor
                            },
                            grid: {
                                color: gridColor
                            }
                        }
                    }
                }
            });

            // 4. 上传下载比例饼图
            const ratioCtx = document.getElementById('ratioChart').getContext('2d');
            ratioChart = new Chart(ratioCtx, {
                type: 'doughnut',
                data: {
                    labels: ['上传流量', '下载流量'],
                    datasets: [{
                        data: [totalUpload, totalDownload],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        datalabels: {
                            color: '#ffffff',
                            font: { weight: 'bold', size: 14 },
                            formatter: function(value, context) {
                                const total = context.dataset.data.reduce((sum, val) => sum + val, 0);
                                const pct = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                                return pct + '%';
                            }
                        },
                        legend: {
                            position: 'top',
                            labels: {
                                color: textColor
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            titleColor: '#ffffff',
                            bodyColor: '#ffffff',
                            borderColor: colors.tooltipBorder,
                            borderWidth: 1,
                            callbacks: {
                                label: function(context) {
                                    const label = context.label || '';
                                    const value = context.raw || 0;
                                    const total = ratioChart.data.datasets[0].data.reduce((sum, val) => sum + val, 0);
                                    const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                                    return `${label}: ${value.toFixed(1)} GB (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });

            // 应用当前主题的系列配色
            applyChartSeries(totalUsageChart);
            applyChartSeries(percentChart);
            applyChartSeries(dailyUsageChart);
            applyChartSeries(ratioChart);
        }

        // 图表按钮事件处理
        function setupChartButtons() {
            // 所有图表按钮
            document.querySelectorAll('.chart-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const range = this.dataset.range;

                    // 更新所有按钮状态 - 所有图表同步切换
                    document.querySelectorAll('.chart-btn').forEach(b => {
                        b.classList.remove('active');
                        b.setAttribute('aria-pressed', b.dataset.range === range);
                        if (b.dataset.range === range) {
                            b.classList.add('active');
                        }
                    });

                    // 更新所有图表数据
                    updateTotalUsageChart(range);
                    updatePercentChart(range);
                    updateDailyUsageChart(range);
                    updateRatioChart(range);
                });
            });
        }

        // 更新总流量使用趋势图
        function updateTotalUsageChart(range) {
            let labels, data;

            if (!isNaN(range)) {
                // 显示最近 {range} 天数据
                labels = dates.slice(-Number(range));
                data = totalUsed.slice(-Number(range));
            } else {
                // 显示全部数据
                labels = dates;
                data = totalUsed;
            }

            totalUsageChart.data.labels = labels;
            totalUsageChart.data.datasets[1].data = data;
            totalUsageChart.update();
        }

        // 更新使用率变化图
        function updatePercentChart(range) {
            let labels, data;

            if (!isNaN(range)) {
                // 显示最近 {range} 天数据
                labels = dates.slice(-Number(range));
                data = usedPercent.slice(-Number(range));
            } else {
                // 显示全部数据
                labels = dates;
                data = usedPercent;
            }

            // 计算当前数据的最小值和最大值，并添加整数余量
            const minValue = Math.min(...data);
            const maxValue = Math.max(...data);

            // 设置纵坐标范围：最小值向下取整为下限，最大值向上取整为上限
            percentChart.options.scales.y.min = Math.floor(minValue);
            percentChart.options.scales.y.max = Math.ceil(maxValue);

            percentChart.data.labels = labels;
            percentChart.data.datasets[0].data = data;
            percentChart.update();
        }

        // 更新每日上传下载图表
        function updateDailyUsageChart(range) {
            let labels, uploadData, downloadData;

            if (!isNaN(range)) {
                // 显示最近 {range} 天数据
                labels = dates.slice(-Number(range));
                uploadData = uploadDaily.slice(-Number(range));
                downloadData = downloadDaily.slice(-Number(range));

                // 计算最近 {range} 天的日均总流量
                const totalData = downloadData.map((d, i) => d + uploadData[i]);
                const avg = totalData.reduce((sum, val) => sum + val, 0) / totalData.length;

                // 更新日均线数据
                dailyUsageChart.data.datasets[2].data = Array(totalData.length).fill(avg);
            } else {
                // 显示全部数据 - 根据开关决定是否包含第一天 (只影响每日上传下载量图表)
                labels = discardDay1 ? dates.slice(1) : dates;
                uploadData = uploadDaily;
                downloadData = downloadDaily;

                // 使用全局平均值
                dailyUsageChart.data.datasets[2].data = Array(processedIncrements.length).fill(avgTotal);
            }

            dailyUsageChart.data.labels = labels;
            dailyUsageChart.data.datasets[0].data = downloadData;
            dailyUsageChart.data.datasets[1].data = uploadData;
            dailyUsageChart.update();
        }

        // 更新上传下载比例饼图
        function updateRatioChart(range) {
            let uploadSum, downloadSum;

            if (!isNaN(range)) {
                // 计算最近 {range} 天的上传下载总量
                const recentUpload = uploadDaily.slice(-Number(range));
                const recentDownload = downloadDaily.slice(-Number(range));
                uploadSum = recentUpload.reduce((sum, val) => sum + val, 0);
                downloadSum = recentDownload.reduce((sum, val) => sum + val, 0);
            } else {
                // 显示全部数据
                uploadSum = totalUpload;
                downloadSum = totalDownload;
            }

            ratioChart.data.datasets[0].data = [uploadSum, downloadSum];
            ratioChart.update();
        }

        // ==================== 主题切换功能 ====================
        /**
         * 初始化主题 - 从 localStorage 读取用户偏好并应用
         */
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        /**
         * 切换主题 - 在亮色/深色模式间切换并保存偏好
         */
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
            updateChartsTheme();
        }

        /**
         * 更新主题切换按钮的图标
         * @param {string} theme - 当前主题 ('light' 或 'dark')
         */
        function updateThemeIcon(theme) {
            const icon = document.querySelector('#theme-toggle i');
            if (icon) {
                icon.className = theme === 'dark' ? 'fa fa-sun-o' : 'fa fa-moon-o';
            }
        }

        /**
         * 更新所有图表的颜色配置以匹配当前主题
         * 会更新 legend、tooltip 和坐标轴的颜色
         */
        function updateChartsTheme() {
            const colors = getThemeColors();
            const textColor = colors.text;
            const gridColor = colors.grid;
            const tooltipBorderColor = colors.tooltipBorder;

            // 更新所有图表的颜色配置
            [totalUsageChart, percentChart, dailyUsageChart, ratioChart].forEach(chart => {
                if (chart) {
                    // 应用当前主题的系列配色
                    applyChartSeries(chart);

                    // 更新 legend 颜色
                    chart.options.plugins.legend.labels.color = textColor;

                    // 更新 tooltip 颜色（统一白字黑底）
                    chart.options.plugins.tooltip.backgroundColor = 'rgba(0, 0, 0, 0.8)';
                    chart.options.plugins.tooltip.titleColor = '#ffffff';
                    chart.options.plugins.tooltip.bodyColor = '#ffffff';
                    chart.options.plugins.tooltip.borderColor = tooltipBorderColor;

                    // 只有存在 scales 的图表才更新坐标轴（饼图没有 scales）
                    if (chart.options.scales) {
                        if (chart.options.scales.x) {
                            chart.options.scales.x.ticks.color = textColor;
                            chart.options.scales.x.title.color = textColor;
                            chart.options.scales.x.grid.color = gridColor;
                        }
                        if (chart.options.scales.y) {
                            chart.options.scales.y.ticks.color = textColor;
                            chart.options.scales.y.title.color = textColor;
                            chart.options.scales.y.grid.color = gridColor;
                        }
                    }

                    // 重新渲染图表
                    chart.update();
                }
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initTheme(); // 初始化主题
            document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
            populateTable();
            initCharts();
            setupChartButtons();
            updateTotalUsageChart('14');
            updatePercentChart('14');
            updateDailyUsageChart('14');
            updateRatioChart('14');
            updateStats(); // 更新统计数据
        });
    </script>
</body>
</html>
